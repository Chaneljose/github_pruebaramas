<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>Iniciar sesión | MIVAVISION</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
  <main class="relative flex min-h-screen items-center justify-center overflow-hidden px-4 py-10">
    <div aria-hidden="true" class="pointer-events-none absolute inset-0">
      <div class="absolute -left-24 -top-24 h-80 w-80 rounded-full bg-emerald-500/20 blur-3xl"></div>
      <div class="absolute -bottom-24 -right-16 h-96 w-96 rounded-full bg-cyan-500/15 blur-3xl"></div>
    </div>

    <section class="relative w-full max-w-md rounded-3xl border border-white/10 bg-slate-900/85 p-8 shadow-2xl shadow-black/30 backdrop-blur-xl sm:p-10">
      <div class="mb-8 text-center">
        <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-emerald-400 text-slate-950 shadow-lg shadow-emerald-500/20">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="h-7 w-7" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 7.5A1.5 1.5 0 0 1 4.5 6h10A1.5 1.5 0 0 1 16 7.5v9a1.5 1.5 0 0 1-1.5 1.5h-10A1.5 1.5 0 0 1 3 16.5v-9Z"/>
            <path stroke-linecap="round" stroke-linejoin="round" d="m16 10 5-3v10l-5-3"/>
            <circle cx="9.5" cy="12" r="2.5"/>
          </svg>
        </div>
        <p class="text-sm font-semibold uppercase tracking-[0.28em] text-emerald-400">MIVAVISION</p>
        <h1 class="mt-3 text-3xl font-bold tracking-tight text-white">Bienvenido</h1>
        <p class="mt-2 text-sm text-slate-400">Inicia sesión para acceder a tu cuenta.</p>
      </div>

      <form id="loginForm" class="space-y-5">
        <div>
          <label for="email" class="mb-2 block text-sm font-medium text-slate-200">Correo electrónico</label>
          <input id="email" name="email" type="email" autocomplete="username" required
            placeholder="tu@correo.com"
            class="w-full rounded-xl border border-slate-700 bg-slate-950/70 px-4 py-3 text-white placeholder:text-slate-500 outline-none transition focus:border-emerald-400 focus:ring-4 focus:ring-emerald-400/10" />
        </div>

        <div>
          <div class="mb-2 flex items-center justify-between gap-3">
            <label for="password" class="block text-sm font-medium text-slate-200">Contraseña</label>
            <a href="#" id="forgotLink" class="text-sm font-medium text-emerald-400 transition hover:text-emerald-300">¿La olvidaste?</a>
          </div>
          <div class="relative">
            <input id="password" name="password" type="password" autocomplete="current-password" required minlength="6"
              placeholder="Ingresa tu contraseña"
              class="w-full rounded-xl border border-slate-700 bg-slate-950/70 px-4 py-3 pr-20 text-white placeholder:text-slate-500 outline-none transition focus:border-emerald-400 focus:ring-4 focus:ring-emerald-400/10" />
            <button type="button" id="togglePassword" class="absolute inset-y-0 right-3 my-auto rounded-md px-2 text-sm font-medium text-slate-400 hover:text-white" aria-label="Mostrar contraseña">Mostrar</button>
          </div>
        </div>

        <div class="flex items-center">
          <input id="remember" name="remember" type="checkbox" class="h-4 w-4 rounded border-slate-600 bg-slate-950 text-emerald-400 focus:ring-emerald-400" />
          <label for="remember" class="ml-2 text-sm text-slate-400">Recordarme</label>
        </div>

        <button type="submit" class="flex w-full items-center justify-center rounded-xl bg-emerald-400 px-4 py-3 font-semibold text-slate-950 shadow-lg shadow-emerald-500/10 transition hover:bg-emerald-300 focus:outline-none focus:ring-4 focus:ring-emerald-400/25">
          Iniciar sesión
        </button>
        <p id="message" role="status" aria-live="polite" class="hidden rounded-xl border border-amber-400/20 bg-amber-400/10 px-4 py-3 text-sm text-amber-200"></p>
      </form>

      <p class="mt-8 text-center text-xs leading-5 text-slate-500">
        Al continuar, aceptas las condiciones de uso y la política de privacidad de MIVAVISION.
      </p>
    </section>
  </main>

  <script>
    const passwordInput = document.getElementById('password');
    const togglePassword = document.getElementById('togglePassword');
    const loginForm = document.getElementById('loginForm');
    const message = document.getElementById('message');

    togglePassword.addEventListener('click', () => {
      const showing = passwordInput.type === 'text';
      passwordInput.type = showing ? 'password' : 'text';
      togglePassword.textContent = showing ? 'Mostrar' : 'Ocultar';
      togglePassword.setAttribute('aria-label', showing ? 'Mostrar contraseña' : 'Ocultar contraseña');
    });

    loginForm.addEventListener('submit', (event) => {
      event.preventDefault();
      message.textContent = 'El diseño del formulario está listo. Para iniciar sesión de forma real, conecta este formulario a un backend de autenticación seguro.';
      message.classList.remove('hidden');
    });

    document.getElementById('forgotLink').addEventListener('click', (event) => {
      event.preventDefault();
      message.textContent = 'Configura aquí el flujo de recuperación de contraseña de tu sistema.';
      message.classList.remove('hidden');
    });
  </script>
</body>
</html>
